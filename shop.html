<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Магазин — Обери свою коробку</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
    }

    .modal-content {
      background-color: #fff;
      margin: 5% auto;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 0 10px #000;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="main-header">
    <h1>🎁 Таємна Коробка</h1>
    <nav class="nav">
      <a href="main.html">Головна</a>
      <a href="shop.html">Магазин</a>
      <a href="about.html">Про нас</a>
      <a href="contact.html">Контакти</a>
    </nav>
    <div class="cart-icon" onclick="toggleCart()">
      🛒 <span id="cart-total">0₴</span>
    </div>
  </header>

  <main class="shop">
    <section class="search-section">
      <input type="text" id="searchBox" placeholder="🔍 Знайти коробку..." oninput="searchBoxes()">
    </section>

    <section class="box-list">
      <script>
        const boxes = [
          { name: 'Міні Коробка', img: 'photo-1698376620993-41b0e91fb0ea.avif', price: 199, desc: 'Невеличкий подарунок для приємного сюрпризу!' },
          { name: 'Супер Коробка', img: 'jouwen-wang-UChknR2z5EM-unsplash.jpg', price: 499, desc: 'Крутий набір середнього розміру з цікавими речами.' },
          { name: 'Мега Коробка', img: 'kelli-mcclintock-GopRYASfsOc-unsplash.jpg', price: 999, desc: 'Тут вже справжній WOW-ефект гарантований!' },
          { name: 'Преміум Коробка', img: 'photo-1663580109961-733a79f45677.avif', price: 1499, desc: 'Розкішні речі всередині – для найвибагливіших.' },
          { name: 'Геймерська Коробка', img: 'premium_photo-1731628586685-ab6a26b89400.avif', price: 799, desc: 'Гаджети, наліпки, ігрові фішки – усе для геймера.' },
          { name: 'Коробка з аксесуарами', img: 'pexels-anastasia-shuraeva-5704738.jpg', price: 299, desc: 'Прикраси, ремінці, браслети та стильні штуки.' },
          { name: 'Коробка-сюрприз для дітей', img: 'premium_photo-1732775543494-a1358838c9b6.avif', price: 399, desc: 'Іграшки, наклейки, солодощі – діти в захваті!' },
          { name: 'Електронна коробка', img: 'pexels-brettjordan-2643698.jpg', price: 899, desc: 'Навушники, кабелі, зарядки – усе, що треба.' },
          { name: 'Коробка для неї', img: 'premium_photo-1661337018602-953ed2dfe95d.avif', price: 549, desc: 'Косметика, аромати, міні-подарунки для дівчат.' },
          { name: 'Коробка для нього', img: 'premium_photo-1731730170212-dc97359b6cbb.avif', price: 549, desc: 'Гаджети, аксесуари й чоловічі цікавинки.' },
          { name: 'Коробка з прикрасами', img: 'pexels-catscoming-1793350.jpg', price: 649, desc: 'Кулони, сережки, браслети – справжній блиск.' },
          { name: 'VIP Коробка', img: 'deepak-gupta-O5JGeKRGP0w-unsplash.jpg', price: 1999, desc: 'Ексклюзивні речі для тих, хто хоче максимум.' },
          { name: 'Коробка для подорожей', img: 'premium_photo-1678983328923-625885fd40e8.avif', price: 699, desc: 'Дорожні набори, міні-косметика, аксесуари.' },
          { name: 'Коробка з канцтоварами', img: 'premium_photo-1685136481944-9fbed1349e41.avif', price: 249, desc: 'Блокноти, ручки, стікери – радість для письма.' },
          { name: 'Коробка-прикол', img: 'pexels-cottonbro-4569863.jpg', price: 199, desc: 'Смішні штуки, які піднімуть настрій 100%.' },
        ];

        document.write(boxes.map(box => `
          <div class="box-item">
            <div class="box-image">
              <img src="${box.img}" alt="${box.name}">
            </div>
            <div class="box-info">
              <h3>${box.name}</h3>
              <p>${box.desc}</p>
              <button onclick="addToCart('${box.name}', ${box.price})">Придбати за ${box.price}₴</button>
            </div>
          </div>
        `).join(''));
      </script>
    </section>
  </main>

  <div id="cart-modal" class="cart-modal">
  <div class="cart-modal-content">
    <span onclick="toggleCart()" class="close-btn">✖</span>
    <h2>🛒 Ваш кошик</h2>
    <ul id="cart-items"></ul>
    <p id="total">Разом: 0₴</p>
    <button onclick="checkout()">Підтвердити покупку</button>
  </div>
</div>

  <footer>
    <p>© 2025 Магазин Сюрпризів | <a href="mailto:support@mysterybox.ua">Зв'язатися з нами</a></p>
  </footer>

  <script src="main.js"></script>
  <div id="toast" class="toast"></div>
</body>
</html>
